name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR では古い実行を取り消す。main への push では、検査を途中で止めない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 全履歴とタグを取得する(リリースノートとタグの対応、push 範囲の検査のため)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:release-notes
      # PR の範囲(全コミットの追加行・ファイル名・メッセージ・作者)の機密検査。手元の pre-push と同じ検査
      - name: 機密検査(PR の範囲)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf 'refs/heads/pr %s refs/heads/main %s\n' "$HEAD_SHA" "$BASE_SHA" | node scripts/check-push-secrets.ts
