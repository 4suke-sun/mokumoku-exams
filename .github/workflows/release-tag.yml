name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # タグは main の履歴上のコミットに付ける
      - name: タグが main の履歴上にあることを確認
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # そのタグに対応するリリースノートのエントリがあること
      - name: リリースノートの検査
        run: node scripts/check-release-notes.ts --tag "$TAG"
      - name: リリース本文を作成
        run: node scripts/release-notes-body.ts "$TAG" > "$RUNNER_TEMP/release-body.md"
      - name: リリースを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-body.md" --verify-tag
